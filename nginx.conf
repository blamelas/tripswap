server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: /destination/paris, /unlocks, /about all resolve to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /images/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
